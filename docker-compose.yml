services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: engine
      POSTGRES_PASSWORD: engine
      POSTGRES_DB: engine
    ports:
      - "5432:5432"
    volumes:
      - engine-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine"]
      interval: 5s
      retries: 10

volumes:
  engine-pg:
