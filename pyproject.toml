[project]
name = "trading-engine"
version = "0.1.0"
description = "Event-sourced, fail-closed automated trading engine (core: event log, risk engine, order manager)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "psycopg[binary]>=3.2", "httpx>=0.27", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "mypy", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engine = ["eventlog/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "live_paper: hits the real Alpaca paper API (needs ALPACA_PAPER_KEY_ID/SECRET); skipped by default",
    "live_robinhood: hits the real Robinhood Crypto API, read-only; skipped by default",
    "live_news: reads real Alpaca news (needs the Alpaca keys); skipped by default",
    "live_anthropic: makes one tiny real Claude call (needs ANTHROPIC_API_KEY); costs a fraction of a cent",
    "live_xai: makes one tiny real Grok call (needs XAI_API_KEY); costs a fraction of a cent",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "E501"]  # the formatter wraps code; long strings/docstrings are fine
