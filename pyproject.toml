[project]
name = "trading-engine"
version = "0.1.0"
description = "Event-sourced, fail-closed automated trading engine (core: event log, risk engine, order manager)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "mypy", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engine = ["eventlog/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]
